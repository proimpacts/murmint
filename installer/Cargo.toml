[package]
name = "murmint-setup"
version = "0.1.0"
edition = "2021"
description = "Murmint's own setup and uninstall windows: branded front ends that run the regular installer silently underneath"
build = "build.rs"

[[bin]]
name = "murmint-setup"
path = "src/main.rs"

[[bin]]
name = "murmint-uninstall"
path = "src/uninstall.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
base64 = "0.22"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

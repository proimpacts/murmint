[package]
name = "murmint-engine"
version = "0.1.0"
edition = "2021"
description = "Murmint request engine: speech-to-text and chat requests, hedged across models, over a JSON-lines pipe"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync", "net"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
fancy-regex = "0.14"
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nnnoiseless = { version = "0.5.2", default-features = false }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 2

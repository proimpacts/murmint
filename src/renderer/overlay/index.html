<!doctype html>
<html lang="en" data-theme="light" data-accent="mono">
<head>
<meta charset="utf-8">
<title>Murmint</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="stage" data-side="right" data-state="idle">
    <div id="bubble" class="bubble" role="status">
      <div id="bacts" class="bacts" hidden>
        <button id="bcopy" type="button" class="bbtn">Copy</button>
        <button id="bdismiss" type="button" class="bbtn ghost">Dismiss</button>
      </div>
      <div id="btext" class="btext"></div>
    </div>
    <div id="pill" class="pill" data-state="idle" title="Drag to move">
      <i id="appico" class="appico" hidden><img alt=""></i>
      <div id="dots" class="dots"></div>
      <span id="label" class="label"></span>
    </div>
  </div>
  <script src="../shared/bridge.js"></script>
  <script src="recorder.js"></script>
  <script src="overlay.js"></script>
</body>
</html>

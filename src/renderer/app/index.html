<!doctype html>
<html lang="en" data-theme="dark" data-accent="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmint</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="look.css">
</head>
<body>
  <div class="dragbar" data-tauri-drag-region></div>
  <div class="winctl" id="winctl">
    <button id="wc-min" aria-label="Minimize" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.1"/></svg></button>
    <button id="wc-max" aria-label="Maximize" title="Maximize"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.1"/></svg></button>
    <button id="wc-close" class="close" aria-label="Close" title="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="m1.5 1.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
  </div>
  <div id="app">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="onboard" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="../shared/bridge.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../overlay/recorder.js"></script>
  <script src="motion.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
  <script src="pages/dashboard.js"></script>
  <script src="pages/history.js"></script>
  <script src="pages/models.js"></script>
  <script src="pages/styles.js"></script>
  <script src="pages/app-presets.js"></script>
  <script src="pages/apps.js"></script>
  <script src="pages/vocabulary.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/onboarding.js"></script>
  <script src="boot.js"></script>
</body>
</html>
